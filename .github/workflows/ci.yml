name: CI

on:
  push:
  pull_request:

jobs:
  r-calendar:
    runs-on: ubuntu-latest
    container:
      image: rocker/r-base:4.5.1@sha256:40fb0a949029b91a86f0a5b091b698977d3d7cd70a22f744e79ddce06812de78
    steps:
      - uses: actions/checkout@v4
      - name: Check German shopping-calendar and school-holiday rules offline
        run: Rscript tests/test_calendar_de.R

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q
